<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join — The Circlebook</title>
    <meta name="description" content="Create your Circlebook profile.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">The Circlebook</a>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="people.html">People</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="active nav-button">Join</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <section class="auth-card register-card">
                <div class="auth-mark">+</div>
                <div class="page-heading">
                    <span class="eyebrow">JOIN THE CIRCLE</span>
                    <h1>Create your profile</h1>
                    <p>Meet people, share what matters, and build meaningful circles.</p>
                </div>
                <form id="registerForm" class="auth-form">
                    <div class="form-group"><label for="fullName">Full Name</label><input type="text" id="fullName" autocomplete="name" required></div>
                    <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" autocomplete="email" required></div>
                    <div class="form-group"><label for="birthday">Birthday</label><input type="date" id="birthday" autocomplete="bday"></div>
                    <div class="form-group"><label for="gender">Gender</label><select id="gender"><option value="">Prefer not to say</option><option value="female">Female</option><option value="male">Male</option><option value="non-binary">Non-binary</option></select></div>
                    <div class="form-group"><label for="location">Location</label><input type="text" id="location" autocomplete="address-level2"></div>
                    <div class="form-group"><label for="education">College / School</label><input type="text" id="education"></div>
                    <div class="form-group"><label for="interests">Interests</label><input type="text" id="interests" placeholder="AI, music, design"></div>
                    <div class="form-group"><label for="password">Password</label><input type="password" id="password" autocomplete="new-password" minlength="6" required></div>
                    <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required></div>
                    <button type="submit" class="btn btn-primary">Create Profile</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer"><div class="container"><p>© <span data-year></span> The Circlebook. A community directory inspired by the early social web.</p></div></footer>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
