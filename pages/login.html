<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — The Circlebook</title>

    <meta
        name="description"
        content="Sign in to your The Circlebook account."
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container header-inner">

            <a href="../index.html" class="logo">
                The Circlebook
            </a>

            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="people.html">People</a>
                <a href="profile.html">My Profile</a>
                <a href="requests.html">Requests</a>
                <a href="register.html">Join</a>
            </nav>

        </div>
    </header>


    <!-- Login -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-intro">
                <span class="eyebrow">WELCOME BACK</span>

                <h1>Sign In</h1>

                <p>
                    Return to your Circlebook and stay connected
                    with the people in your circle.
                </p>
            </div>


            <div class="auth-card">

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit"
                    >
                        Sign In
                    </button>

                </form>


                <div class="auth-divider">
                    <span>New to The Circlebook?</span>
                </div>


                <a
                    href="register.html"
                    class="btn btn-secondary auth-secondary"
                >
                    Create Your Profile
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                © <span data-year></span> The Circlebook.
                A community directory inspired by the early social web.
            </p>

        </div>

    </footer>


    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>

</body>
</html>
