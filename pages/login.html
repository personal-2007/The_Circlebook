<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — The Circlebook</title>

    <meta
        name="description"
        content="Sign in to your Circlebook profile."
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">The Circlebook</a>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="people.html">People</a>
                <a href="login.html" class="active">Login</a>
                <a href="register.html" class="nav-button">Join</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <section class="auth-card">
                <div class="auth-mark">C</div>

                <div class="page-heading">
                    <span class="eyebrow">WELCOME BACK</span>
                    <h1>Sign In</h1>
                    <p>Return to your Circlebook and your community.</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span data-year></span> The Circlebook. A community directory inspired by the early social web.</p>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
