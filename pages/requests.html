<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests — The Circlebook</title>

    <link rel="stylesheet" href="../css/style.css">

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">The Circlebook</a>

    </main>
    <footer class="site-footer"><div class="container"><p>© <span data-year></span> The Circlebook. A community directory inspired by the early social web.</p></div></footer>
