<!DOCTYPE html>
<html lang="en" data-theme="glass-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="The Circlebook - Know Your People. Build Your Circle. Vintage Community Directory & Social Network.">
    <title>The Circlebook - Master Platform</title>

    <!-- Main & Module Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/icons.js"></script>

    <!-- Splash Screen Redirect Check -->
    <script>
        if (!sessionStorage.getItem("circlebook_splash_seen") && !window.location.search.includes("loaded=true")) {
            window.location.href = "system/loading.html";
        }
    </script>
</head>
<body>

    <!-- Ambient Background Blur Glows -->
    <div class="ambient-blue-glow"></div>
    <div class="ambient-purple-glow"></div>

    <!-- =========================================================
         MASTER APP SHELL LAYOUT
    ========================================================= -->
    <div class="app-shell" id="appShell">

        <!-- PRIMARY SIDEBAR NAVIGATION -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="#home/feed" class="sidebar-brand">
                    <img src="assets/images/circlebook-logo.png" alt="The Circlebook Logo" class="brand-logo-img" />
                    <span>The <strong>Circlebook</strong></span>
                </a>
                <button class="sidebar-toggle" type="button" aria-label="Minimize menu" onclick="CirclebookApp.toggleSidebarMinimize()">
                    <script>document.write(CirclebookIcons.get('chevron-left', '', 18))</script>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section-title">NAVIGATION</div>
                <button class="sidebar-link active" data-module="home" onclick="CirclebookRouter.navigate('home')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('home'))</script></span>
                    <span>Home</span>
                </button>
                <button class="sidebar-link" data-module="mycircle" onclick="CirclebookRouter.navigate('mycircle')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('users'))</script></span>
                    <span>My Circle</span>
                    <span class="sidebar-badge" id="sidebarCircleBadge">42</span>
                </button>
                <button class="sidebar-link" data-module="discover" onclick="CirclebookRouter.navigate('discover')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('discover'))</script></span>
                    <span>Discover</span>
                </button>
                <button class="sidebar-link" data-module="communities" onclick="CirclebookRouter.navigate('communities')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('communities'))</script></span>
                    <span>Communities</span>
                </button>
                <button class="sidebar-link" data-module="events" onclick="CirclebookRouter.navigate('events')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('calendar'))</script></span>
                    <span>Events</span>
                </button>

                <div class="sidebar-section-title">MESSAGES & NOTIFICATIONS</div>
                <button class="sidebar-link" data-module="communication" onclick="CirclebookRouter.navigate('communication')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('message'))</script></span>
                    <span>Messages</span>
                    <span class="sidebar-badge" style="background: var(--primary-blue, #2563EB);">3</span>
                </button>
                <button class="sidebar-link" data-module="notifications" onclick="CirclebookRouter.navigate('notifications')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('bell'))</script></span>
                    <span>Notifications</span>
                    <span class="sidebar-badge" id="sidebarNotifBadge">4</span>
                </button>

                <div class="sidebar-section-title">CAREER & TOOLS</div>
                <button class="sidebar-link" data-module="career" onclick="CirclebookRouter.navigate('career')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('briefcase'))</script></span>
                    <span>Career Hub</span>
                </button>
                <button class="sidebar-link" data-module="ai" onclick="CirclebookRouter.navigate('ai')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('sparkles'))</script></span>
                    <span>Circle AI</span>
                </button>

                <div class="sidebar-section-title">ACCOUNT</div>
                <button class="sidebar-link" data-module="profile" onclick="CirclebookRouter.navigate('profile')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('user'))</script></span>
                    <span>Profile</span>
                </button>
                <button class="sidebar-link" data-module="settings" onclick="CirclebookRouter.navigate('settings')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('settings'))</script></span>
                    <span>Settings</span>
                </button>
                <button class="sidebar-link" data-module="safety" onclick="CirclebookRouter.navigate('safety')">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('shield'))</script></span>
                    <span>Safety</span>
                </button>
                <button class="sidebar-link admin-only-link" data-module="admin" onclick="CirclebookRouter.navigate('admin')" style="display: none;" id="sidebarAdminBtn">
                    <span class="sidebar-icon"><script>document.write(CirclebookIcons.get('lock'))</script></span>
                    <span>Admin Suite</span>
                </button>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="app-main">
            <!-- TOP APP HEADER -->
            <header class="app-topbar" id="appTopbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" aria-label="Toggle Mobile Menu" onclick="CirclebookApp.toggleMobileSidebar()">
                        <script>document.write(CirclebookIcons.get('menu', '', 20))</script>
                    </button>
                    <div class="global-search-bar">
                        <span class="search-icon"><script>document.write(CirclebookIcons.get('search', '', 16))</script></span>
                        <input type="text" id="globalSearchInput" placeholder="Search people, topics, skills..." onfocus="CirclebookRouter.navigate('discover', 'people')" oninput="CirclebookApp.filterDiscoverPeople(this.value)">
                    </div>
                </div>

                <div class="topbar-actions">
                    <button class="topbar-btn" title="Messages" aria-label="Messages" onclick="CirclebookRouter.navigate('communication')">
                        <script>document.write(CirclebookIcons.get('message', '', 18))</script>
                    </button>
                    <button class="topbar-btn" title="Notifications" aria-label="Notifications" onclick="CirclebookRouter.navigate('notifications')">
                        <script>document.write(CirclebookIcons.get('bell', '', 18))</script>
                    </button>

                    <div class="topbar-theme-wrapper" style="position: relative;">
                        <button class="topbar-btn theme-btn" title="Theme" aria-label="Theme menu" onclick="CirclebookApp.toggleThemeMenu(event)">
                            <span class="theme-btn-label">Theme</span>
                        </button>
                        <div class="cb-dropdown-menu theme-menu" id="topbarThemeMenu" style="display: none; min-width: 190px;">
                            <div class="cb-dropdown-header" style="padding-bottom: 0.5rem;">
                                <div style="font-weight: 700;">Choose Theme</div>
                            </div>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookStore.applyTheme('glass-light'); CirclebookRouter.render();">
                                <span class="theme-swatch theme-light"></span> Glass Light
                            </button>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookStore.applyTheme('glass-dark'); CirclebookRouter.render();">
                                <span class="theme-swatch theme-dark"></span> Glass Dark
                            </button>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookStore.applyTheme('modern-blue'); CirclebookRouter.render();">
                                <span class="theme-swatch theme-modern-blue"></span> Modern Blue
                            </button>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookStore.applyTheme('purple-luxe'); CirclebookRouter.render();">
                                <span class="theme-swatch theme-purple"></span> Purple Luxe
                            </button>
                        </div>
                    </div>
                    
                    <div class="topbar-user-wrapper" style="position: relative;">
                        <div class="topbar-user" onclick="CirclebookApp.toggleProfileMenu(event)" id="topbarUserBtn" aria-expanded="false" role="button" aria-label="User Account Menu">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80" id="topbarAvatar" class="topbar-avatar" alt="User Avatar" />
                            <span class="topbar-username" id="topbarUsername">Aarav Sharma</span>
                            <span class="topbar-user-chevron"><script>document.write(CirclebookIcons.get('chevron-down', '', 14))</script></span>
                        </div>
                        
                        <!-- PROFILE DROPDOWN MENU -->
                        <div class="cb-dropdown-menu" id="topbarProfileMenu" style="display: none;">
                            <div class="cb-dropdown-header">
                                <div style="font-weight: 600;" id="dropdownUserName">Aarav Sharma</div>
                                <div style="font-size: 0.78rem; color: var(--text-secondary);" id="dropdownUserHandle">@aarav_sharma</div>
                            </div>
                            <div class="cb-dropdown-divider"></div>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookRouter.navigate('profile');">
                                <script>document.write(CirclebookIcons.get('user', '', 16))</script> View Profile
                            </button>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookRouter.navigate('settings');">
                                <script>document.write(CirclebookIcons.get('settings', '', 16))</script> Settings & Privacy
                            </button>
                            <button class="cb-dropdown-item" onclick="CirclebookApp.closeDropdowns(); CirclebookRouter.navigate('safety');">
                                <script>document.write(CirclebookIcons.get('shield', '', 16))</script> Safety Center
                            </button>
                            <div class="cb-dropdown-divider"></div>
                            <button class="cb-dropdown-item danger" onclick="CirclebookApp.closeDropdowns(); CirclebookApp.confirmLogout();">
                                <script>document.write(CirclebookIcons.get('logout', '', 16))</script> Log Out
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- SUB-HEADER NAVIGATION TABS -->
            <nav class="sub-header-nav" id="subHeaderNav">
                <!-- Dynamically filled by CirclebookRouter -->
            </nav>

            <!-- DYNAMIC MODULE VIEWPORT -->
            <div class="module-viewport" id="moduleViewport">
                <!-- Dynamically rendered by CirclebookViews -->
            </div>
        </main>

    </div>

    <!-- MOBILE STICKY BOTTOM NAVIGATION -->
    <nav class="mobile-bottom-nav" id="mobileBottomNav">
        <button class="mobile-nav-item" aria-label="Home" onclick="CirclebookRouter.navigate('home')">
            <span class="nav-icon"><script>document.write(CirclebookIcons.get('home', '', 20))</script></span>
            <span>Home</span>
        </button>
        <button class="mobile-nav-item" aria-label="People" onclick="CirclebookRouter.navigate('discover', 'people')">
            <span class="nav-icon"><script>document.write(CirclebookIcons.get('users', '', 20))</script></span>
            <span>People</span>
        </button>
        <button class="mobile-nav-item" aria-label="Create Post" onclick="CirclebookApp.openCreatePostModal()">
            <div class="mobile-nav-create">
                <script>document.write(CirclebookIcons.get('plus', '', 22))</script>
            </div>
        </button>
        <button class="mobile-nav-item" aria-label="Messages" onclick="CirclebookRouter.navigate('communication')">
            <span class="nav-icon"><script>document.write(CirclebookIcons.get('message', '', 20))</script></span>
            <span>Messages</span>
        </button>
        <button class="mobile-nav-item" aria-label="Profile" onclick="CirclebookRouter.navigate('profile')">
            <span class="nav-icon"><script>document.write(CirclebookIcons.get('user', '', 20))</script></span>
            <span>Profile</span>
        </button>
    </nav>

    <!-- REUSABLE GLOBAL MODAL BACKDROP -->
    <div class="circle-modal-backdrop" id="globalModalBackdrop">
        <div class="circle-modal-box" id="globalModalBox">
            <!-- Modal Content Injected via CirclebookApp.openModal() -->
        </div>
    </div>

    <!-- JavaScript Scripts -->
    <script src="js/state.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
