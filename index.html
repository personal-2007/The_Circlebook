<!DOCTYPE html>
<html lang="en" data-theme="vintage-gold">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Circlebook - Know Your People. Build Your Circle. Vintage Community Directory & Social Network.">
    <title>The Circlebook - Master Platform</title>

    <!-- Main & Module Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Splash Screen Redirect Check -->
    <script>
        if (!sessionStorage.getItem("circlebook_splash_seen") && !window.location.search.includes("loaded=true")) {
            window.location.href = "system/loading.html";
        }
    </script>
</head>
<body>

    <!-- =========================================================
         MASTER APP SHELL LAYOUT
    ========================================================= -->
    <div class="app-shell">

        <!-- PRIMARY SIDEBAR NAVIGATION (15 MASTER DOMAINS) -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="#home/feed" class="sidebar-brand">
                    📜 The <span>Circlebook</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section-title">CORE PLATFORM</div>
                <button class="sidebar-link" data-module="entry" onclick="CirclebookRouter.navigate('entry')">
                    <span class="sidebar-icon">🚀</span> ENTRY
                </button>
                <button class="sidebar-link" data-module="auth" onclick="CirclebookRouter.navigate('auth')">
                    <span class="sidebar-icon">🔐</span> AUTH
                </button>
                <button class="sidebar-link active" data-module="home" onclick="CirclebookRouter.navigate('home')">
                    <span class="sidebar-icon">🏠</span> HOME
                </button>

                <div class="sidebar-section-title">EXPLORE & CIRCLE</div>
                <button class="sidebar-link" data-module="discover" onclick="CirclebookRouter.navigate('discover')">
                    <span class="sidebar-icon">🔎</span> DISCOVER
                </button>
                <button class="sidebar-link" data-module="mycircle" onclick="CirclebookRouter.navigate('mycircle')">
                    <span class="sidebar-icon">👥</span> MY CIRCLE
                    <span class="sidebar-badge">42</span>
                </button>
                <button class="sidebar-link" data-module="profile" onclick="CirclebookRouter.navigate('profile')">
                    <span class="sidebar-icon">👤</span> PROFILE
                </button>

                <div class="sidebar-section-title">INTERACTION & HUBS</div>
                <button class="sidebar-link" data-module="communication" onclick="CirclebookRouter.navigate('communication')">
                    <span class="sidebar-icon">💬</span> COMMUNICATION
                    <span class="sidebar-badge" style="background: var(--india-green, green);">3</span>
                </button>
                <button class="sidebar-link" data-module="notifications" onclick="CirclebookRouter.navigate('notifications')">
                    <span class="sidebar-icon">🔔</span> NOTIFICATIONS
                    <span class="sidebar-badge">4</span>
                </button>
                <button class="sidebar-link" data-module="communities" onclick="CirclebookRouter.navigate('communities')">
                    <span class="sidebar-icon">🌐</span> COMMUNITIES
                </button>
                <button class="sidebar-link" data-module="events" onclick="CirclebookRouter.navigate('events')">
                    <span class="sidebar-icon">📅</span> EVENTS
                </button>

                <div class="sidebar-section-title">CAREER & AI</div>
                <button class="sidebar-link" data-module="career" onclick="CirclebookRouter.navigate('career')">
                    <span class="sidebar-icon">💼</span> CAREER HUB
                </button>
                <button class="sidebar-link" data-module="ai" onclick="CirclebookRouter.navigate('ai')">
                    <span class="sidebar-icon">🤖</span> CIRCLE AI
                </button>

                <div class="sidebar-section-title">CONTROL & GOVERNANCE</div>
                <button class="sidebar-link" data-module="settings" onclick="CirclebookRouter.navigate('settings')">
                    <span class="sidebar-icon">⚙️</span> SETTINGS
                </button>
                <button class="sidebar-link" data-module="safety" onclick="CirclebookRouter.navigate('safety')">
                    <span class="sidebar-icon">🛡️</span> SAFETY
                </button>
                <button class="sidebar-link" data-module="admin" onclick="CirclebookRouter.navigate('admin')">
                    <span class="sidebar-icon">🧑💼</span> ADMIN
                </button>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="app-main">
            <!-- TOP APP HEADER -->
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" onclick="CirclebookApp.toggleMobileSidebar()">☰</button>
                    <div class="global-search-bar">
                        <span class="search-icon">🔍</span>
                        <input type="text" placeholder="Search people, communities, events, jobs..." onfocus="CirclebookRouter.navigate('discover')" oninput="CirclebookApp.filterDiscoverPeople(this.value)">
                    </div>
                </div>

                <div class="topbar-actions">
                    <button class="topbar-btn" title="Toggle Theme" onclick="const themes=['vintage-gold','vintage-dark','modern-navy','emerald-clean']; const next=themes[(themes.indexOf(CirclebookStore.currentUser.appearance.theme)+1)%themes.length]; CirclebookStore.applyTheme(next); CirclebookRouter.render();">🎨</button>
                    <button class="topbar-btn" title="Notifications" onclick="CirclebookRouter.navigate('notifications')">
                        🔔
                    </button>
                    <button class="topbar-btn" title="Messages" onclick="CirclebookRouter.navigate('communication')">💬</button>
                    
                    <div class="topbar-user" onclick="CirclebookRouter.navigate('profile')">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80" class="topbar-avatar" alt="User Avatar" />
                        <span class="topbar-username">Aarav Sharma</span>
                    </div>
                </div>
            </header>

            <!-- SUB-HEADER NAVIGATION TABS -->
            <nav class="sub-header-nav" id="subHeaderNav">
                <!-- Dynamically filled by CirclebookRouter -->
            </nav>

            <!-- DYNAMIC MODULE VIEWPORT -->
            <div class="module-viewport" id="moduleViewport">
                <!-- Dynamically rendered by CirclebookViews -->
            </div>
        </main>

    </div>

    <!-- FLOATING AI ASSISTANT ACTION BUTTON -->
    <button class="floating-ai-btn" title="Circle AI Assistant" onclick="CirclebookRouter.navigate('ai')">
        🤖
    </button>

    <!-- JavaScript Scripts -->
    <script src="js/state.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
